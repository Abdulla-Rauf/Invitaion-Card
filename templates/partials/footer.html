{{define "footer"}}
<footer id="footer" class="section footer-section" aria-label="Closing Section">
  <div class="section-container">
    <!-- Final Closing Section: Emotional, Pure & Intimate -->
    <div class="final-closing-card fade-in-up" data-delay="100">
      <!-- Architectural Inset Frame -->
      <div class="closing-inner-frame" aria-hidden="true"></div>

      <!-- Subtle Botanical Floral Decoration -->
      <div class="closing-floral-decor" aria-hidden="true">
        <svg viewBox="0 0 220 36" class="closing-floral-svg" fill="none">
          <path d="M15 18 Q 55 8 85 14 Q 100 18 110 18 Q 120 18 135 14 Q 165 8 205 18" stroke="#C5A059" stroke-width="0.95" opacity="0.8"/>
          <path d="M55 13 C 48 10 50 4 56 6 C 60 10 58 13 55 13 Z" fill="#7A8B7B" opacity="0.85"/>
          <path d="M165 13 C 172 10 170 4 164 6 C 160 10 162 13 165 13 Z" fill="#7A8B7B" opacity="0.85"/>
          <path d="M86 14 C 82 9 86 4 91 7 C 93 11 89 14 86 14 Z" fill="#9DB09E" opacity="0.8"/>
          <path d="M134 14 C 138 9 134 4 129 7 C 127 11 131 14 134 14 Z" fill="#9DB09E" opacity="0.8"/>
          <circle cx="76" cy="14" r="4.5" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="75" cy="13" r="2.8" fill="#F7D6D0"/>
          <circle cx="144" cy="14" r="4.5" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="145" cy="13" r="2.8" fill="#F7D6D0"/>
          <circle cx="110" cy="18" r="7.5" fill="#501625"/>
          <path d="M104 18 C 104 13 116 13 116 18 C 116 23 104 23 104 18 Z" fill="#6B2337"/>
          <path d="M106 17 C 107 15 113 15 114 17 C 113 20 107 20 106 17 Z" fill="#822B42"/>
          <circle cx="110" cy="18" r="1.6" fill="#C5A059"/>
        </svg>
      </div>

      <!-- Fahad & Samar Monogram Logo -->
      <div class="closing-logo-wrap">
        <img src="/static/images/fahad-samar-logo.png" 
             alt="Muhammed Fahad and Samar Salman official monogram logo" 
             class="closing-logo-img"
             width="50"
             height="75"
             loading="lazy"
             decoding="async">
      </div>

      <!-- Display: Fahad & Samar -->
      <div class="closing-couple-names" aria-label="Fahad and Samar">
        <span class="closing-name">Fahad</span>
        <span class="closing-ampersand" aria-hidden="true">&amp;</span>
        <span class="closing-name">Samar</span>
      </div>

      <!-- Then: 29 November 2026 -->
      <div class="closing-date-wrap">
        <span class="closing-date-line"></span>
        <span class="closing-date-text">29 November 2026</span>
        <span class="closing-date-line"></span>
      </div>

      <!-- And: "With love, duas & gratitude" -->
      <p class="closing-sentiment">With love, duas &amp; gratitude</p>

      <!-- Add: "Thank you for being a part of our special day." -->
      <p class="closing-gratitude-msg">Thank you for being a part of our special day.</p>

      <!-- Islamic Benediction & Prayer -->
      <div class="closing-benediction" aria-label="Jazakumullahu Khairan">
        <div class="closing-jazakallah" dir="rtl">جَزَاكُمُ اللَّهُ خَيْرًا</div>
        <span class="closing-jazakallah-sub">Jazakumullahu Khairan</span>
      </div>

      <!-- Subtle Floral Bottom Flourish -->
      <div class="closing-bottom-flourish" aria-hidden="true">
        <svg viewBox="0 0 140 24" class="closing-flourish-svg" fill="none">
          <path d="M10 12 L50 12" stroke="#C5A059" stroke-width="0.8" opacity="0.6"/>
          <path d="M90 12 L130 12" stroke="#C5A059" stroke-width="0.8" opacity="0.6"/>
          <path d="M48 12 C 44 8 48 4 52 7 C 54 10 51 12 48 12 Z" fill="#7A8B7B" opacity="0.8"/>
          <path d="M92 12 C 96 8 92 4 88 7 C 86 10 89 12 92 12 Z" fill="#7A8B7B" opacity="0.8"/>
          <circle cx="62" cy="12" r="3" fill="#E2B4BD"/>
          <circle cx="78" cy="12" r="3" fill="#E2B4BD"/>
          <circle cx="70" cy="12" r="4.5" fill="#6B2337"/>
          <circle cx="70" cy="12" r="1.5" fill="#C5A059"/>
        </svg>
      </div>

      <!-- At the very bottom: "Made with love for our special day" -->
      <div class="closing-footer-note">
        <span class="closing-heart-ornament" aria-hidden="true">♥</span>
        <p class="closing-footnote-text">Made with love for our special day</p>
      </div>
    </div>
  </div>
</footer>
{{end}}
