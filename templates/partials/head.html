{{define "head"}}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <!-- Primary Meta Tags -->
  <title>{{.Meta.Title}}</title>
  <meta name="title" content="{{.Meta.Title}}">
  <meta name="description" content="{{.Meta.Description}}">
  <meta name="author" content="Muhammed Fahad &amp; Samar Salman">
  <meta name="theme-color" content="#FFF5F5">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{.Meta.URL}}">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{.Meta.URL}}">
  <meta property="og:title" content="{{.Meta.Title}}">
  <meta property="og:description" content="{{.Meta.Description}}">
  <meta property="og:image" content="{{.Meta.URL}}/static/images/couple-illustration.png">
  <meta property="og:image:secure_url" content="{{.Meta.URL}}/static/images/couple-illustration.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="736">
  <meta property="og:image:height" content="979">
  <meta property="og:image:alt" content="Muhammed Fahad &amp; Samar Salman Wedding Reception Invitation Illustration">
  <meta property="og:site_name" content="Fahad &amp; Samar Wedding">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{.Meta.URL}}">
  <meta name="twitter:title" content="{{.Meta.Title}}">
  <meta name="twitter:description" content="{{.Meta.Description}}">
  <meta name="twitter:image" content="{{.Meta.URL}}/static/images/couple-illustration.png">
  <meta name="twitter:image:alt" content="Muhammed Fahad &amp; Samar Salman Wedding Reception Invitation Illustration">

  <!-- Favicon and Touch Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/images/fahad-samar-logo.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/images/fahad-samar-logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/images/fahad-samar-logo.png">
  <link rel="shortcut icon" href="/static/images/fahad-samar-logo.png">

  <!-- Schema.org JSON-LD Structured Data for Event / Social Sharing -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "{{.Meta.Title}}",
    "description": "{{.Meta.Description}}",
    "startDate": "2026-11-29T11:30:00+05:30",
    "endDate": "2026-11-29T15:00:00+05:30",
    "eventStatus": "https://schema.org/EventScheduled",
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "location": {
      "@type": "Place",
      "name": "{{.Venue.Name}}",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "{{.Venue.City}}",
        "addressLocality": "Nilambur",
        "addressRegion": "Kerala",
        "postalCode": "679332",
        "addressCountry": "IN"
      }
    },
    "image": [
      "{{.Meta.URL}}/static/images/couple-illustration.png",
      "{{.Meta.URL}}/static/images/fahad-samar-logo.png"
    ],
    "organizer": {
      "@type": "Person",
      "name": "Muhammed Fahad & Samar Salman"
    }
  }
  </script>

  <!-- Resource Hints & Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- Critical Above-the-fold Image Preloads (Zero First-Screen Latency & No Lazy-Load Delay) -->
  <link rel="preload" as="image" href="/static/images/fahad-samar-logo.png" fetchpriority="high">
  <link rel="preload" as="image" href="/static/images/couple-illustration.png" fetchpriority="high">

  <!-- Google Fonts: Cormorant Garamond, Great Vibes, Outfit, Amiri with font-display: swap -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/style.css?v=16.0">
</head>
{{end}}
