{{define "wedding-date"}}
<!-- ==========================================================================
     PAGE / SECTION — WEDDING DATE (EDITORIAL LUXURY PRINTED INVITATION STYLE)
     Primary Date: 29 November 2026
     Features: Save The Date • Large Elegant 29 • Decorative Gold Framing
     ========================================================================== -->
<section id="wedding-date" class="section page-wedding-date" aria-label="Wedding Date Section">
  <div class="wedding-date-card-wrapper fade-in-up">
    
    <!-- Printed Stationery Parchment Surface -->
    <div class="wedding-date-card">
      
      <!-- Architectural Gold Corner Brackets -->
      <div class="date-corner-bracket date-corner-tl" aria-hidden="true"></div>
      <div class="date-corner-bracket date-corner-tr" aria-hidden="true"></div>
      <div class="date-corner-bracket date-corner-bl" aria-hidden="true"></div>
      <div class="date-corner-bracket date-corner-br" aria-hidden="true"></div>

      <!-- Botanical Corner Sprigs (Burgundy, Dusty Rose, Sage Green, Gold Branches) -->
      <div class="date-floral-corner tl" aria-hidden="true">
        <svg viewBox="0 0 54 54" class="date-corner-svg" fill="none">
          <path d="M4 4 Q 14 10 28 6 Q 38 4 48 8" stroke="#C5A059" stroke-width="0.9" opacity="0.8"/>
          <path d="M4 4 Q 10 14 6 28 Q 4 38 8 48" stroke="#C5A059" stroke-width="0.9" opacity="0.8"/>
          <path d="M30 6 C 33 3 38 5 39 8 C 36 10 32 9 30 6 Z" fill="#7A8B7B" opacity="0.85"/>
          <path d="M6 30 C 3 33 5 38 8 39 C 10 36 9 32 6 30 Z" fill="#7A8B7B" opacity="0.85"/>
          <circle cx="28" cy="10" r="3.2" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="10" cy="28" r="3.2" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="14" cy="14" r="6" fill="#501625"/>
          <circle cx="14" cy="14" r="4.6" fill="#6B2337"/>
          <circle cx="14" cy="14" r="1.5" fill="#C5A059"/>
        </svg>
      </div>
      <div class="date-floral-corner tr" aria-hidden="true">
        <svg viewBox="0 0 54 54" class="date-corner-svg" fill="none">
          <path d="M4 4 Q 14 10 28 6 Q 38 4 48 8" stroke="#C5A059" stroke-width="0.9" opacity="0.8"/>
          <path d="M4 4 Q 10 14 6 28 Q 4 38 8 48" stroke="#C5A059" stroke-width="0.9" opacity="0.8"/>
          <path d="M30 6 C 33 3 38 5 39 8 C 36 10 32 9 30 6 Z" fill="#7A8B7B" opacity="0.85"/>
          <path d="M6 30 C 3 33 5 38 8 39 C 10 36 9 32 6 30 Z" fill="#7A8B7B" opacity="0.85"/>
          <circle cx="28" cy="10" r="3.2" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="10" cy="28" r="3.2" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="14" cy="14" r="6" fill="#501625"/>
          <circle cx="14" cy="14" r="4.6" fill="#6B2337"/>
          <circle cx="14" cy="14" r="1.5" fill="#C5A059"/>
        </svg>
      </div>
      <div class="date-floral-corner bl" aria-hidden="true">
        <svg viewBox="0 0 54 54" class="date-corner-svg" fill="none">
          <path d="M4 4 Q 14 10 28 6 Q 38 4 48 8" stroke="#C5A059" stroke-width="0.9" opacity="0.8"/>
          <path d="M4 4 Q 10 14 6 28 Q 4 38 8 48" stroke="#C5A059" stroke-width="0.9" opacity="0.8"/>
          <path d="M30 6 C 33 3 38 5 39 8 C 36 10 32 9 30 6 Z" fill="#7A8B7B" opacity="0.85"/>
          <path d="M6 30 C 3 33 5 38 8 39 C 10 36 9 32 6 30 Z" fill="#7A8B7B" opacity="0.85"/>
          <circle cx="28" cy="10" r="3.2" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="10" cy="28" r="3.2" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="14" cy="14" r="6" fill="#501625"/>
          <circle cx="14" cy="14" r="4.6" fill="#6B2337"/>
          <circle cx="14" cy="14" r="1.5" fill="#C5A059"/>
        </svg>
      </div>
      <div class="date-floral-corner br" aria-hidden="true">
        <svg viewBox="0 0 54 54" class="date-corner-svg" fill="none">
          <path d="M4 4 Q 14 10 28 6 Q 38 4 48 8" stroke="#C5A059" stroke-width="0.9" opacity="0.8"/>
          <path d="M4 4 Q 10 14 6 28 Q 4 38 8 48" stroke="#C5A059" stroke-width="0.9" opacity="0.8"/>
          <path d="M30 6 C 33 3 38 5 39 8 C 36 10 32 9 30 6 Z" fill="#7A8B7B" opacity="0.85"/>
          <path d="M6 30 C 3 33 5 38 8 39 C 10 36 9 32 6 30 Z" fill="#7A8B7B" opacity="0.85"/>
          <circle cx="28" cy="10" r="3.2" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="10" cy="28" r="3.2" fill="#E2B4BD" opacity="0.95"/>
          <circle cx="14" cy="14" r="6" fill="#501625"/>
          <circle cx="14" cy="14" r="4.6" fill="#6B2337"/>
          <circle cx="14" cy="14" r="1.5" fill="#C5A059"/>
        </svg>
      </div>

      <!-- Outer & Inner Decorative Gold Framing Lines -->
      <div class="date-frame-outer" aria-hidden="true"></div>
      <div class="date-frame-inner" aria-hidden="true"></div>

      <!-- Top Small Decorative Line: "SAVE THE DATE" -->
      <div class="date-header-wrap">
        <div class="date-eyebrow-line" aria-hidden="true">
          <span class="gold-hairline"></span>
          <span class="gold-gem">✦</span>
          <span class="gold-hairline"></span>
        </div>
        <p class="save-the-date-text">SAVE THE DATE</p>
        <div class="date-eyebrow-line" aria-hidden="true">
          <span class="gold-hairline"></span>
          <span class="gold-gem">✦</span>
          <span class="gold-hairline"></span>
        </div>
      </div>

      <!-- Central Stately Date Presentation (Printed Luxury Invitation Style) -->
      <div class="date-centerpiece">
        
        <!-- Day of the Week Header -->
        <div class="date-weekday-wrap">
          <span class="date-weekday">Sunday</span>
        </div>

        <!-- Decorative Gold Flanking Lines around the "29" -->
        <div class="date-numeral-stage">
          <div class="flanking-gold-pillar left-pillar" aria-hidden="true">
            <span class="pillar-diamond">◆</span>
            <span class="pillar-line"></span>
            <span class="pillar-diamond">◆</span>
          </div>

          <!-- Large Elegant "29" -->
          <div class="date-day-number-wrap">
            <span class="date-day-number">29</span>
          </div>

          <div class="flanking-gold-pillar right-pillar" aria-hidden="true">
            <span class="pillar-diamond">◆</span>
            <span class="pillar-line"></span>
            <span class="pillar-diamond">◆</span>
          </div>
        </div>

        <!-- Decorative Gold Divider Line -->
        <div class="date-divider-ornament" aria-hidden="true">
          <span class="ornament-rule"></span>
          <span class="ornament-motif">❦</span>
          <span class="ornament-rule"></span>
        </div>

        <!-- Month: NOVEMBER -->
        <div class="date-month-wrap">
          <h3 class="date-month-text">NOVEMBER</h3>
        </div>

        <!-- Year: 2026 -->
        <div class="date-year-wrap">
          <span class="date-year-text">2026</span>
        </div>

        <!-- Primary Wedding Date Subtitle -->
        <div class="date-primary-summary">
          <p class="primary-date-line">Twenty-Ninth of November, Two Thousand Twenty-Six</p>
          <p class="hijri-date-line">☪ {{.Event.HijriDisplay}} &bull; 11:30 AM to 03:00 PM (IST)</p>
        </div>

      </div>

      <!-- Editorial Calendar Action -->
      <div class="date-action-wrap">
        <a href="/calendar.ics" class="btn-editorial-calendar" download="wedding-fahad-and-samar.ics" aria-label="Add 29 November 2026 to Calendar">
          <svg class="cal-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span class="cal-btn-label">ADD TO CALENDAR</span>
        </a>
      </div>

      <!-- Bottom Symmetrical Decorative Accent -->
      <div class="date-bottom-flourish" aria-hidden="true">
        <span class="flourish-gold-bar"></span>
        <span class="flourish-star">✦</span>
        <span class="flourish-gold-bar"></span>
      </div>

    </div>
  </div>
</section>
{{end}}
